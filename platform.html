<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06323a">
<title>Emek Sermaye Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700;800&family=Red+Hat+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/brand.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner wrap">
    <a class="brand" href="./" aria-label="Emek Sermaye tanıtım sayfası">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="10" style="fill:var(--accent)"/>
        <path d="M20 6.5 31.7 13.25v13.5L20 33.5 8.3 26.75v-13.5z" style="fill:none;stroke:var(--accent-ink);stroke-width:2.4;stroke-linejoin:round"/>
        <rect x="13.6" y="20.6" width="3.3" height="6.4" rx="1" style="fill:var(--accent-ink)"/>
        <rect x="18.35" y="17.2" width="3.3" height="9.8" rx="1" style="fill:var(--accent-ink)"/>
        <rect x="23.1" y="13.8" width="3.3" height="13.2" rx="1" style="fill:var(--accent-ink)"/>
      </svg>
      <span class="brand-text"><b>Emek <em>Sermaye</em></b><small>Yatırımcı platformu</small></span>
    </a>
    <nav class="nav" aria-label="Ana menü">
      <a href="#fabrikalar" data-action="view" data-view="fabrikalar" class="nav-link">Fabrikalar</a>
      <a href="#makinelerim" data-action="view" data-view="makinelerim" class="nav-link">Makinelerim</a>
      <a href="#analiz" data-action="view" data-view="analiz" class="nav-link">Analiz</a>
    </nav>
    <div class="top-right">
      <span class="mode-chip" id="mode-chip" data-mode="demo" title="Verinin nereden geldiği">Demo verisi</span>
      <div class="clock mono" id="clock" aria-live="off"></div>
      <div class="top-net" title="Bu ay şu ana kadarki net kârınız">
        <span>Bu ay net</span><b id="top-net">—</b>
      </div>
      <button class="icon-btn" id="theme-btn" data-action="theme" aria-label="Temayı değiştir" title="Açık / koyu tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
      <div class="account">
        <button class="avatar" id="account-btn" data-action="account" aria-haspopup="menu" aria-expanded="false" title="Hesap">DA</button>
        <div class="account-menu" id="account-menu" role="menu" hidden></div>
      </div>
    </div>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

<div class="drawer-backdrop" id="drawer-backdrop" data-action="close-drawer" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<div class="modal-backdrop" id="modal-root" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/live.js"></script>
<script src="assets/backend.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
